name: Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - feature/refit-v1-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Verify offline demo without backend configuration
        run: |
          printf 'SUPABASE_URL=\nSUPABASE_PUBLISHABLE_KEY=\n' > local.properties
          ./gradlew :app:testDebugUnitTest --tests '*OfflineDemoLaunchTest' -Pkotlin.incremental=false --stacktrace
          cp -r app/build/reports/tests/testDebugUnitTest app/build/reports/tests/offline-demo

      - name: Unit tests, lint, and debug build
        run: |
          # Keep tests independent of whether a developer has configured the app.
          # SDK integration tests isolate HTTP rather than using a live project.
          printf 'SUPABASE_URL=https://test.supabase.co\nSUPABASE_PUBLISHABLE_KEY=public-test-key\n' > local.properties
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -Pkotlin.incremental=false --continue --stacktrace

      - name: Verify and build installable phone APK
        run: |
          printf 'SUPABASE_URL=\nSUPABASE_PUBLISHABLE_KEY=\nVISION_SERVER_URL=\n' > local.properties
          ./gradlew :app:testPhoneUnitTest --tests '*PhoneSecurityTest' :app:lintPhone :app:assemblePhone -Pkotlin.incremental=false --continue --stacktrace
          python3 scripts/verify_phone_apk.py app/build/outputs/apk/phone/app-phone-unsigned.apk
          mkdir -p build/phone-delivery
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 app/build/outputs/apk/phone/app-phone-unsigned.apk build/phone-delivery/refit-phone-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -c 4 build/phone-delivery/refit-phone-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/phone-delivery/apksigner.jar
          cp build/phone-security.json build/phone-delivery/phone-security.json

      - name: Upload installable phone build inputs
        uses: actions/upload-artifact@v4
        with:
          name: refit-phone-unsigned-verified
          path: build/phone-delivery/

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refit-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/tests/offline-demo
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-phone.*
            app/build/reports/tests/testPhoneUnitTest
            app/build/outputs/patient-screens/*.png

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: refit-debug-build-check
          path: app/build/outputs/apk/debug/app-debug.apk

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: refit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: refit_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify schema, ownership policies, and idempotent upsert
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: refit_test
          PGUSER: postgres
          PGPASSWORD: refit_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ownership.sql


