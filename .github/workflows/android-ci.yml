name: Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - feature/refit-v1-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Verify offline demo without backend configuration
        run: |
          printf 'SUPABASE_URL=\nSUPABASE_PUBLISHABLE_KEY=\n' > local.properties
          ./gradlew :app:testDebugUnitTest --tests '*OfflineDemoLaunchTest' -Pkotlin.incremental=false --stacktrace
          cp -r app/build/reports/tests/testDebugUnitTest app/build/reports/tests/offline-demo

      - name: Unit tests, lint, and debug build
        run: |
          # Keep tests independent of whether a developer has configured the app.
          # SDK integration tests isolate HTTP rather than using a live project.
          printf 'SUPABASE_URL=https://test.supabase.co\nSUPABASE_PUBLISHABLE_KEY=public-test-key\n' > local.properties
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -Pkotlin.incremental=false --continue --stacktrace

      - name: Build configured QA app
        run: |
          python3 - <<'PY_CONFIG'
          import json
          from pathlib import Path
          config = json.loads(Path('.github/refit-public-config.json').read_text())
          assert config['url'].startswith('https://')
          assert config['publishableKey'].startswith('sb_publishable_')
          Path('local.properties').write_text('SUPABASE_URL=' + config['url'] + '\nSUPABASE_PUBLISHABLE_KEY=' + config['publishableKey'] + '\n')
          PY_CONFIG
          ./gradlew :app:assembleQa -Pkotlin.incremental=false --stacktrace

      - name: Upload configured QA APK
        uses: actions/upload-artifact@v4
        with:
          name: refit-configured-qa-apk
          path: app/build/outputs/apk/qa/app-qa.apk

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refit-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/tests/offline-demo
            app/build/reports/lint-results-debug.*
            app/build/outputs/patient-screens/*.png

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: refit-debug-build-check
          path: app/build/outputs/apk/debug/app-debug.apk

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: refit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: refit_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify schema, ownership policies, and idempotent upsert
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: refit_test
          PGUSER: postgres
          PGPASSWORD: refit_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ownership.sql


