name: Android CI

# Temporary mode:
# The repository currently cannot start GitHub-hosted runners reliably.
# Keep CI available for manual verification, while local Gradle Wrapper builds
# are the canonical build path until repository ownership/Actions is stabilized.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify hardened internal APK
        shell: bash
        run: ./scripts/build_internal.sh

      - name: Upload hardened internal APK
        uses: actions/upload-artifact@v4
        with:
          name: refit-v0.4-internal-hardened-apk
          path: app/build/outputs/apk/internal/app-internal.apk
          if-no-files-found: error
