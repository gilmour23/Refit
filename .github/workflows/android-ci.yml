name: Android CI

on:
  push:
    branches:
      - feature/refit-v1-foundation
  pull_request:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: |
          # Keep tests independent of whether a developer has configured the app.
          # SDK integration tests isolate HTTP rather than using a live project.
          printf 'SUPABASE_URL=https://test.supabase.co\nSUPABASE_PUBLISHABLE_KEY=public-test-key\n' > local.properties
          gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: |
          rm local.properties
          gradle :app:assembleDebug --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refit-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: refit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: refit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: refit_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify schema, ownership policies, and idempotent upsert
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: refit_test
          PGUSER: postgres
          PGPASSWORD: refit_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ownership.sql
