name: Web demo
on:
  push:
    branches: ['feature/web-demo-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install vision runtime
        run: python -m pip install -r vision/requirements.txt httpx
      - name: Download official hand model
        run: python scripts/fetch_model.py
      - name: Python API and image tests
        run: python -m unittest discover -s vision/tests -v
        env:
          PYTHONPATH: vision
      - name: Native model and HTTP smoke
        run: python vision/tests/native_smoke.py
        env:
          PYTHONPATH: vision
      - name: Browser protocol tests
        run: node --test vision/tests/web-core.test.mjs vision/tests/ble.test.mjs
      - name: JavaScript syntax
        run: node --check vision/web/app.js
